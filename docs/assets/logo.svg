<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" width="100%" height="100%">
  <defs>
    <!-- AutoCAD Drafting Grid Pattern -->
    <pattern id="cadGridMajor" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2530" stroke-width="1" />
      <circle cx="0" cy="0" r="1.5" fill="#2d3748" />
    </pattern>
    <pattern id="cadGridMinor" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#181e26" stroke-width="0.5" />
    </pattern>

    <!-- Glow filters for CAD neon vector lines -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00ffff" flood-opacity="0.6"/>
    </filter>
    <filter id="yellowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ffd700" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- AutoCAD Model Space Background -->
  <rect width="840" height="280" rx="14" fill="#12151a" stroke="#252b36" stroke-width="2" />
  <rect width="840" height="280" rx="14" fill="url(#cadGridMinor)" />
  <rect width="840" height="280" rx="14" fill="url(#cadGridMajor)" />

  <!-- Technical Framing & Coordinate Crosshairs -->
  <g stroke="#3b4252" stroke-width="1" opacity="0.6">
    <!-- Top-left framing -->
    <path d="M 20 40 L 20 20 L 40 20" fill="none"/>
    <!-- Top-right framing -->
    <path d="M 800 20 L 820 20 L 820 40" fill="none"/>
    <!-- Bottom-left framing -->
    <path d="M 20 240 L 20 260 L 40 260" fill="none"/>
    <!-- Bottom-right framing -->
    <path d="M 800 260 L 820 260 L 820 240" fill="none"/>
  </g>

  <!-- AutoCAD Status Bar / Header Meta -->
  <g font-family="'JetBrains Mono', 'Fira Code', 'Consolas', monospace" font-size="11" font-weight="600">
    <text x="35" y="38" fill="#4a5568">MODEL SPACE [2D/3D]</text>
    <text x="210" y="38" fill="#00ffff" opacity="0.8">LAYER: 0-DEBIM-CORE</text>
    <text x="385" y="38" fill="#ffd700" opacity="0.8">COLOR: BYLAYER</text>
    <text x="530" y="38" fill="#48bb78" opacity="0.8">SNAP: ON  GRID: ON  ORTHO: ON</text>
    <text x="745" y="38" fill="#718096" text-anchor="end">AUTOCAD / IFC4</text>
  </g>

  <!-- Dimension line / Technical Guideline -->
  <g stroke="#2d3748" stroke-dasharray="4 4" stroke-width="1">
    <line x1="60" y1="195" x2="780" y2="195" />
    <line x1="60" y1="95" x2="780" y2="95" />
  </g>

  <!-- ================= LOGO ICON (>_) ================= -->
  <g id="logo-icon">
    <!-- AutoCAD Crosshair near Prompt -->
    <g stroke="#ff4d4d" stroke-width="1" opacity="0.4">
      <line x1="55" y1="145" x2="85" y2="145" />
      <line x1="70" y1="130" x2="70" y2="160" />
      <circle cx="70" cy="145" r="4" fill="none" />
    </g>

    <!-- ">" Prompt / Winking Eye (AutoCAD Electric Cyan) -->
    <path d="M 95 105 L 145 145 L 95 185" 
          fill="none" 
          stroke="#00ffff" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#cyanGlow)" />

    <!-- Technical tick marks on ">" vertex -->
    <circle cx="145" cy="145" r="3" fill="#ffffff" />
    <line x1="145" y1="135" x2="145" y2="155" stroke="#ffffff" stroke-width="1.5" />

    <!-- "_" Cursor / Smirk Smile (AutoCAD Cyber Yellow) -->
    <line x1="170" y1="185" x2="235" y2="185" 
          stroke="#ffd700" 
          stroke-width="14" 
          stroke-linecap="round"
          filter="url(#yellowGlow)" />

    <!-- CAD snap box on cursor -->
    <rect x="165" y="178" width="75" height="14" fill="none" stroke="#ff8800" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>
  </g>

  <!-- ================= TYPOGRAPHY (debim) ================= -->
  <g id="logo-text">
    <text x="270" y="180" 
          font-family="'JetBrains Mono', 'Fira Code', 'Consolas', 'Courier New', monospace" 
          font-size="88" 
          font-weight="800" 
          letter-spacing="-2px"
          fill="#f7fafc">
      debim
    </text>

    <!-- Subtle CAD accent dot/tag -->
    <circle cx="600" cy="120" r="5" fill="#00e5ff" />
    <text x="612" y="125" 
          font-family="'JetBrains Mono', 'Consolas', monospace" 
          font-size="12" 
          font-weight="700" 
          fill="#00e5ff">
      .yaml
    </text>
  </g>

  <!-- Subtitle / Tagline: Building-as-Code -->
  <g font-family="'JetBrains Mono', 'Consolas', monospace">
    <text x="275" y="222" font-size="14" font-weight="600" fill="#a0aec0" letter-spacing="4px">
      BUILDING-AS-CODE <tspan fill="#4a5568">//</tspan> <tspan fill="#48bb78">DECLARATIVE BIM COMPILER</tspan>
    </text>
  </g>

  <!-- Bottom AutoCAD UCS Icon (X-Red, Y-Green) -->
  <g transform="translate(45, 235)">
    <!-- Origin point -->
    <rect x="-3" y="-3" width="6" height="6" fill="#718096" />
    <!-- X Axis (Red) -->
    <line x1="0" y1="0" x2="28" y2="0" stroke="#f56565" stroke-width="2.5" />
    <polygon points="28,-4 36,0 28,4" fill="#f56565" />
    <text x="40" y="4" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#f56565">X</text>
    <!-- Y Axis (Green) -->
    <line x1="0" y1="0" x2="0" y2="-28" stroke="#48bb78" stroke-width="2.5" />
    <polygon points="-4,-28 0,-36 4,-28" fill="#48bb78" />
    <text x="-4" y="-40" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#48bb78">Y</text>
    <!-- WCS Label -->
    <text x="10" y="-12" font-family="'JetBrains Mono', monospace" font-size="9" fill="#718096">WCS</text>
  </g>

  <!-- Bottom-right live coordinate readouts -->
  <g font-family="'JetBrains Mono', 'Consolas', monospace" font-size="11" fill="#718096" text-anchor="end">
    <text x="805" y="248">X: 12000.00  Y: 8500.00  Z: +3.20m</text>
  </g>
</svg>

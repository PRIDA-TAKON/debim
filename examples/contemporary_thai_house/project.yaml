      riser_finish: "PAINT_WHITE"
      nosing: true
      nosing_type: "ALUMINUM_STRIP"
    railing:
      height: 0.90
      type: "STEEL_HANDRAIL"
      side: "BOTH"
      layout: "DOUBLE"

    reinforcement:
      main: "DB12 @ 0.15m"
      temperature: "RB9 @ 0.20m"


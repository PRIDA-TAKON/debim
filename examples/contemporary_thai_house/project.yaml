  # F0.80x0.80 (2 Piles, หนา 0.25 m, 4+4 RB9)
  - class: IfcFooting
    tag: F-A1
    material: CONC_210
    profile: { shape: BOX, width: 0.80, depth: 0.80, thickness: 0.25 }
    placement: { grid: ["1", "A"], storey: L0_FOUNDATION }
    reinforcement: { mesh_x: "4-RB9", mesh_y: "4-RB9" }
    piles:
      count: 2
      profile: { shape: HEXAGONAL, dimension: 0.15 }
      length: 6.00
      spacing: 0.50


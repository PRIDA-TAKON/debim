schema: IFC4-Minimal
project:
  id: PRJ-THAI-HOUSE-05
  name: "Contemporary Thai House 5 (บ้านครอบครัวไทยร่วมสมัย ๕)"
  units: { length: METER, area: SQUARE_METER, volume: CUBIC_METER }

spatial_structure:
  storeys:
    - id: L0_FOUNDATION
      name: "Foundation & Footing Level"
      elevation: -1.50
      height: 1.50
    - id: L1_GROUND
      name: "Level 1 Ground Floor"
      elevation: 0.00
      height: 3.75
    - id: L2_SECOND
      name: "Level 2 Second Floor"
      elevation: 3.75
      height: 2.90
    - id: L3_ROOF
      name: "Roof & Truss Level"
      elevation: 6.65
      height: 1.50

grids:
  axes_x:
    "1": 0.00
    "2": 4.00
    "3": 6.00
    "4": 9.00
  axes_y:
    "A": 0.00
    "B": 1.80
    "C": 5.50
    "D": 7.70
    "E": 11.40
    "F": 13.40

materials:
  - id: CONC_210
    name: "Structural Concrete 1:2:4 (fc' 210 ksc)"
    category: concrete
    unit_cost_ref: "MAT-CONC-210"
  - id: BRICK_MON
    name: "Clay Brick Wall (ผนังก่ออิฐมอญครึ่งแผ่น)"
    category: masonry
    unit_cost_ref: "MAT-BRICK-01"
  - id: STEEL_SS400
    name: "Structural Steel Truss (โครงหลังคาเหล็ก)"
    category: steel
    unit_cost_ref: "MAT-STEEL-01"
  - id: CONC_PLANK
    name: "Precast Concrete Plank 5cm + Topping"
    category: concrete
    unit_cost_ref: "MAT-SLAB-PLANK"
  - id: ROOF_TILE_CONC
    name: "CPAC Monier Concrete Roof Tile (กระเบื้องหลังคาคอนกรีตซีแพคโมเนีย)"
    category: covering
    unit_cost_ref: "MAT-ROOF-TILE"
  - id: PIPE_PPR
    name: "PPR Hot/Cold Water Pipe (ท่อน้ำดี PPR)"
    category: plumbing
    unit_cost_ref: "MAT-PIPE-PPR-25"
  - id: PIPE_PVC_BLUE
    name: "PVC Pipe Class 8.5 Blue (ท่อน้ำดี PVC ฟ้า)"
    category: plumbing
    unit_cost_ref: "MAT-PIPE-PVC-BLUE-20"
  - id: PIPE_PVC_GREY
    name: "PVC Soil & Waste Pipe (ท่อน้ำเสีย/ท่อน้ำทิ้ง PVC)"
    category: drainage
    unit_cost_ref: "MAT-PIPE-PVC-GREY-100"
  - id: CONDUIT_EMT
    name: "Electrical Metallic Tubing (ท่อร้อยสายไฟ EMT)"
    category: electrical
    unit_cost_ref: "MAT-CONDUIT-EMT-20"
  - id: SANITARY_WARE
    name: "Sanitary Ceramic Fixtures (สุขภัณฑ์และอุปกรณ์)"
    category: sanitary
    unit_cost_ref: "MAT-WC-SET"
  - id: ELEC_SYSTEM
    name: "Electrical Devices & Fixtures (ตู้ไฟและดวงโคม)"
    category: electrical
    unit_cost_ref: "MAT-CONSUMER-UNIT"
  - id: HVAC_SYSTEM
    name: "Air Conditioning & Ventilation (ระบบปรับอากาศและระบายอากาศ)"
    category: hvac
    unit_cost_ref: "MAT-AC-WALL-18000"


# ==============================================================================
# Model: Museo Soumaya (Plaza Carso, Mexico City) — Pure Algorithmic Architecture
# Architect: FR-EE (Fernando Romero Enterprise) & Ove Arup (2011)
# Benchmark: debim v1.0.0 Flagship Milestone (Hyperbolic Loft & 16,000 Hex Panels)
# ==============================================================================

schema: IFC4-Minimal
version: "1.0.0"
project:
  id: "PRJ-MUSEO-SOUMAYA-2011"
  name: "Museo Soumaya (Fernando Romero / Arup, 2011 - Mexico City)"
  architect: "FR-EE (Fernando Romero Enterprise) & Ove Arup"
  units:
    length: METER
    area: SQUARE_METER
    volume: CUBIC_METER

spatial_structure:
  storeys:
  - id: L0
    name: "Ground Floor Lobby & Vestibule"
    elevation: 0.0
    height: 6.5
  - id: L1
    name: "Gallery 1 - Pre-Hispanic & Colonial Art"
    elevation: 6.5
    height: 6.5
  - id: L2
    name: "Gallery 2 - European Masters & Auguste Rodin"
    elevation: 13.0
    height: 6.5
  - id: L3
    name: "Gallery 3 - Impressionism & European Avant-Garde"
    elevation: 19.5
    height: 6.5
  - id: L4
    name: "Gallery 4 - Modern Mexican Art (Rivera, Tamayo)"
    elevation: 26.0
    height: 6.5
  - id: L5
    name: "Gallery 5 - Temporary International Exhibitions"
    elevation: 32.5
    height: 6.5
  - id: L6
    name: "Gallery 6 - Crown Skylight Sculpture Hall"
    elevation: 39.0
    height: 7.0

grids:
  axes_x:
    "1": -25.0
    "2": 0.0
    "3": 25.0
  axes_y:
    "A": -25.0
    "B": 0.0
    "C": 25.0

materials:
  - id: ALUMINUM_ANODIZED_SILVER
    name: Anodized Silver Aluminum Hexagonal Facade Panel
    category: metal
    unit_cost_ref: MAT-ALU-HEX
  - id: STEEL_WHITE
    name: Curved Tubular Structural Steel (CHS600)
    category: steel
    unit_cost_ref: MAT-STEEL-CHS
  - id: CONCRETE_C30
    name: Structural Post-Tensioned Concrete C30/37
    category: concrete
    unit_cost_ref: MAT-CONC-280


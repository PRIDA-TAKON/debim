    - [23.45, 19.59]
    - [13.0, 27.59]
    - [-0.06, 31.96]
    - [-13.06, 27.47]
    - [-19.07, 15.09]
    - [-23.79, 5.91]
  waist_polygon:
    - [-16.34, -3.35]
    - [-16.74, -9.38]

schema: IFC4-Minimal
project:
  id: PRJ-THAI-HOUSE-05
  name: "Contemporary Thai House 5 (บ้านครอบครัวไทยร่วมสมัย ๕)"
  units: { length: METER, area: SQUARE_METER, volume: CUBIC_METER }

spatial_structure:
  storeys:
    - id: L0_FOUNDATION
      name: "Foundation & Footing Level"
      elevation: -1.50
      height: 1.50
    - id: L1_GROUND
      name: "Level 1 Ground Floor"
      elevation: 0.00
      height: 3.75
    - id: L2_SECOND
      name: "Level 2 Second Floor"
      elevation: 3.75
      height: 2.90
    - id: L3_ROOF
      name: "Roof & Truss Level"
      elevation: 6.65
      height: 1.50

grids:
  axes_x:
    "0": -1.00   # Eaves overhang left
    "1": 0.00
    "2": 4.00
    "3": 6.00
    "4": 9.00
    "5": 10.00   # Eaves overhang right
  axes_y:
    "00": -0.20  # Eaves overhang front outer
    "0": 0.80    # Eaves overhang front inner
    "A": 0.00
    "A1": 1.15   # Porch net ceiling (4.00m x 1.15m = 4.60m2)
    "B0": 1.10   # Side terrace front start (10.30m length from y=1.10 to y=11.40)
    "B": 1.80
    "C": 5.50
    "C1": 6.20   # Bath 1 level 2 divider (3.00m x 1.50m = 4.50m2)
    "D": 7.70
    "D1": 9.70   # Bath level 1 divider (3.00m x 2.00m = 6.00m2)
    "D2": 9.20   # Bath 2 level 2 divider (3.00m x 1.50m = 4.50m2)
    "D3": 9.666666666666666   # Hall level 2 rear divider (3.00m x 1.7333m = 5.20m2)
    "E": 11.40
    "F": 13.40
    "G": 13.80   # Eaves overhang rear inner
    "G1": 14.80  # Eaves overhang rear outer

materials:
  - id: CONC_210
    name: "Structural Concrete 1:2:4 (fc' 210 ksc)"
    category: concrete
    unit_cost_ref: "MAT-CONC-210"
  - id: BRICK_MON
    name: "Clay Brick Wall (ผนังก่ออิฐมอญครึ่งแผ่น)"
    category: masonry
    unit_cost_ref: "MAT-BRICK-01"
  - id: STEEL_SS400
    name: "Structural Steel Truss (โครงหลังคาเหล็ก)"
    category: steel
    unit_cost_ref: "MAT-STEEL-01"
  - id: CONC_PLANK
    name: "Precast Concrete Plank 5cm + Topping"
    category: concrete
    unit_cost_ref: "MAT-SLAB-PLANK"
  - id: ROOF_TILE_CONC
    name: "CPAC Monier Concrete Roof Tile (กระเบื้องหลังคาคอนกรีตซีแพคโมเนีย)"
    category: covering
    unit_cost_ref: "MAT-ROOF-TILE"
  - id: PIPE_PPR
    name: "PPR Hot/Cold Water Pipe (ท่อน้ำดี PPR)"
    category: plumbing
    unit_cost_ref: "MAT-PIPE-PPR-25"
  - id: PIPE_PVC_BLUE
    name: "PVC Pipe Class 8.5 Blue (ท่อน้ำดี PVC ฟ้า)"
    category: plumbing
    unit_cost_ref: "MAT-PIPE-PVC-BLUE-20"
  - id: PIPE_PVC_GREY
    name: "PVC Soil & Waste Pipe (ท่อน้ำเสีย/ท่อน้ำทิ้ง PVC)"
    category: drainage
    unit_cost_ref: "MAT-PIPE-PVC-GREY-100"
  - id: CONDUIT_EMT
    name: "Electrical Metallic Tubing (ท่อร้อยสายไฟ EMT)"
    category: electrical
    unit_cost_ref: "MAT-CONDUIT-EMT-20"
  - id: SANITARY_WARE
    name: "Sanitary Ceramic Fixtures (สุขภัณฑ์และอุปกรณ์)"
    category: sanitary
    unit_cost_ref: "MAT-WC-SET"
  - id: ELEC_SYSTEM
    name: "Electrical Devices & Fixtures (ตู้ไฟและดวงโคม)"
    category: electrical
    unit_cost_ref: "MAT-CONSUMER-UNIT"
  - id: HVAC_SYSTEM
    name: "Air Conditioning & Ventilation (ระบบปรับอากาศและระบายอากาศ)"
    category: hvac
    unit_cost_ref: "MAT-AC-WALL-18000"
  - id: CEIL_GYPSUM
    name: "Gypsum Board Ceiling 9mm (ฝ้าเพดานยิปซั่มฉาบเรียบ 9 มม.)"
    category: covering
    unit_cost_ref: "MAT-CEIL-GYPSUM"
  - id: CEIL_TBAR
    name: "T-Bar Moisture Resistant Ceiling 9mm (ฝ้าเพดานทีบาร์ทนชื้นห้องน้ำ 9 มม.)"
    category: covering
    unit_cost_ref: "MAT-CEIL-TBAR"
  - id: CEIL_EAVES
    name: "Ventilated Eaves Ceiling (ฝ้าเพดานชายคาระบายอากาศ)"
    category: covering
    unit_cost_ref: "MAT-CEIL-EAVES"
  - id: FIN_TILE_FLOOR
    name: "Ceramic Floor Tiles (งานปูกระเบื้องพื้นเซรามิค)"
    category: covering
    unit_cost_ref: "MAT-TILE-FLOOR"
  - id: FIN_CONC_POLISH
    name: "Polished Concrete Finish (ผิวคอนกรีตขัดเรียบ/ขัดมัน)"
    category: finishes
    unit_cost_ref: "MAT-CONC-POLISH"
  - id: FIN_SKIRTING
    name: "Fiber Cement Skirting Board 4\" (บัวเชิงผนังไฟเบอร์ซีเมนต์ 4 นิ้ว)"
    category: finishes
    unit_cost_ref: "MAT-SKIRTING"
  - id: EARTH_EXCAV
    name: "Excavation for Footings (งานดินขุดฐานราก)"
    category: earthwork
    unit_cost_ref: "MAT-EARTH-EXCAV"

includes:
  - "modules/structure_sub.yaml"
  - "modules/columns.yaml"
  - "modules/beams.yaml"
  - "modules/slabs.yaml"
  - "modules/stairs.yaml"
  - "modules/walls.yaml"
  - "modules/roof.yaml"
  - "modules/coverings.yaml"
  - "modules/mep_plumbing.yaml"
  - "modules/mep_electrical.yaml"

name: "debim Building-as-Code CI"
description: "Runs debim building rule compliance check, QTO/Cost diff, and posts PR comment report."

inputs:
  base_manifest:
    description: "Path to Base branch project manifest (.debim / project.yaml)"
    required: false
    default: "project.yaml"
  head_manifest:
    description: "Path to PR Head branch project manifest (.debim / project.yaml)"
    required: false
    default: "project.yaml"
  rules:
    description: "QTO & Pricing rules standard (e.g., 'cg-v480')"
    required: false
    default: "cg-v480"
  jurisdiction:
    description: "Building control regulations jurisdiction (e.g. 'th', 'sg', 'us', 'uk')"
    required: false
    default: "th"
  comment_pr:
    description: "Whether to comment on pull request"
    required: false
    default: "true"

outputs:
  report_path:
    description: "Path to generated Markdown report file"
    value: "pr_report.md"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install debim
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ -f "pyproject.toml" ]; then
          pip install -e ".[all]"
        else
          pip install "debim[all]"
        fi

    - name: Checkout Base Branch Manifest
      shell: bash
      run: |
        git fetch origin ${{ github.base_ref }}:base_ref || true
        git show base_ref:${{ inputs.base_manifest }} > base_manifest.debim || cp ${{ inputs.base_manifest }} base_manifest.debim

    - name: Run debim CI Report
      shell: bash
      run: |
        debim ci report --base base_manifest.debim --head ${{ inputs.head_manifest }} --rules ${{ inputs.rules }} -j ${{ inputs.jurisdiction }} -o pr_report.md

    - name: Comment PR Report
      if: inputs.comment_pr == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('pr_report.md', 'utf8');
          const botHeader = '## 🏢 Building-as-Code CI Audit & Cost Diff Report';

          const comments = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const existingBotComment = comments.data.find(c => c.body.includes(botHeader));
          if (existingBotComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existingBotComment.id,
              body: report,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report,
            });
          }

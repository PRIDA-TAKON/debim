[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "debim"
version = "0.1.0"
description = "A minimal, Git-native, declarative BIM engine (Building-as-Code) designed for AI agents and humans."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "PRIDA-TAKON" }
]
keywords = ["bim", "building-as-code", "openbim", "ifc", "declarative", "cad", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Architecture / Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "trimesh>=4.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
ifc = [
    "ifcopenshell>=0.7.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
debim = "debim.cli:app"
bim = "debim.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "debim"
version = "0.3.1"
description = "A minimal, Git-native, declarative BIM engine & Model Context Protocol (MCP) Server for AI agents and humans."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "PRIDA-TAKON" }
]
keywords = ["bim", "building-as-code", "openbim", "ifc", "declarative", "cad", "ai-agents", "mcp", "model-context-protocol", "fastmcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "trimesh>=4.0.0",
    "numpy>=1.24.0",
    "shapely>=2.0.0",
    "ezdxf>=1.1.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0,<2",
]
ifc = [
    "ifcopenshell>=0.7.0",
]
docx = [
    "python-docx>=1.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "python-docx>=1.1.0",
]
all = [
    "ifcopenshell>=0.7.0",
    "mcp>=1.0.0,<2",
    "python-docx>=1.1.0",
]

[project.scripts]
debim = "debim.cli:app"
bim = "debim.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
debim = ["*.html", "*.css", "**/templates/*.html", "**/styles/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
